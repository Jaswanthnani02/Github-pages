  <text x="56" y="570" fill="#a8b8cc" font-family="Helvetica, Arial, sans-serif" font-size="12">Public proof: ticket-dispatcher-demo and mcp-rbac-demo on GitHub. Live dashboard UI stays private; see redacted mock on this site.</text>
